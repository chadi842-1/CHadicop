[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fibre360"
version = "2.0.0"
description = "Plateforme decisionnelle du parcours Commande -> Livraison Fibre (data analyse, process mining, ML, reporting)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.7"]
llm = ["anthropic>=0.39"]

[project.scripts]
fibre360 = "fibre360.cli:main"

[tool.setuptools.packages.find]
include = ["fibre360*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
